[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brislaw"
dynamic = ["version"]
description = "Search, retrieve, cite-check, and pin-cite Texas case law from CourtListener"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.21.0",
    "click>=8.1.0",
    "beautifulsoup4>=4.12.0",
    "rich>=14.0.0",
    "httpx>=0.28.0",
    "keyring>=25.0.0",
    "markdownify>=1.2.0",
    "eyecite>=2.7.0",
    "platformdirs>=4.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
brislaw = "brislaw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brislaw = ["prompts/*.txt"]

[tool.setuptools.dynamic]
version = {attr = "brislaw.__version__"}
